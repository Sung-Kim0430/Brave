name: Tests and Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/braveStaticContracts.test.mjs

  lint-js:
    name: JavaScript Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check base/main.js
          echo "✓ JavaScript syntax is valid"

  lint-php:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          for file in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$file"
          done
          echo "✓ All PHP files are syntactically valid"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, lint-js, lint-php]
    if: always()

    steps:
      - name: Summary
        run: echo "Build completed"
